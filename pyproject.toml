[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# N815: camelCase fields are the JSON wire contract shared with the TypeScript backend.
ignore = ["UP007", "UP006", "UP035", "B008", "N815", "N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
